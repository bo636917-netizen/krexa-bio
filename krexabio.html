        /* Minecraft Pixel Dirt/Bedrock Texture Background Pattern */
        .mc-bg-pattern {
            background-color: #1a1614;
            background-image: 
                repeating-linear-gradient(45deg, #26201c 0, #26201c 10px, #1a1614 0, #1a1614 20px),
                linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0.95));
        }

        /* Minecraft Authentic Button Style */
        .mc-button {
            position: relative;
            background-color: #707070;
            border-top: 4px solid #a8a8a8;
            border-left: 4px solid #a8a8a8;
            border-right: 4px solid #383838;
            border-bottom: 4px solid #383838;

            text-shadow: 2px 2px 0px #202020;

            cursor: pointer;
        }

        .mc-button:hover {
            background-color: #7d81a8;
            border-top-color: #b8bce0;
            border-left-color: #b8bce0;
            border-right-color: #434661;
            border-bottom-color: #434661;
            box-shadow: inset -4px -4px 0px 0px #282a3d, inset 4px 4px 0px 0px #676a8f;
            color: #ffffa0;
            text-shadow: 2px 2px 0px #2b2800;
        }

        .mc-button:active {
            background-color: #4a4a4a;
            border-top: 4px solid #242424;
            border-left: 4px solid #242424;
            border-right: 4px solid #a8a8a8;
            border-bottom: 4px solid #a8a8a8;
            box-shadow: inset -4px -4px 0px 0px #5c5c5c, inset 4px 4px 0px 0px #181818;
            padding-top: 2px;
        }

        /* Minecraft Container / Dialog Panel */
        .mc-panel {
            background-color: #c6c6c6;
            border-top: 4px solid #ffffff;
            border-left: 4px solid #ffffff;
            border-right: 4px solid #555555;
            border-bottom: 4px solid #555555;

            color: #373737;
        }

        /* Minecraft Inventory Hotbar Slot Container */
        .mc-slot-container {
            background-color: #8b8b8b;
            border-top: 3px solid #373737;
            border-left: 3px solid #373737;
            border-right: 3px solid #ffffff;
            border-bottom: 3px solid #ffffff;
            box-shadow: inset 3px 3px 0px 0px #202020;
        }

        /* Minecraft Font Title Shadow */
        .mc-title {
            color: #ffffff;
            text-shadow: 4px 4px 0px #3f3f3f, 6px 6px 0px #000000;
        }

        .mc-subtitle {
            color: #ffff55;
            text-shadow: 2px 2px 0px #3f3f00;
        }

        /* Floating splash text animation */
        @keyframes mc-splash {
            0% { transform: scale(1) rotate(-5deg); }
            50% { transform: scale(1.08) rotate(-5deg); }
            100% { transform: scale(1) rotate(-5deg); }
        }

        .splash-text {
            animation: mc-splash 0.8s infinite ease-in-out;
            color: #ffff55;
            text-shadow: 2px 2px 0px #3f3f00;
            font-family: 'Silkscreen', monospace;
        }

        /* Custom Pixel Avatar Border */
        .mc-avatar-frame {
            border: 4px solid #ffffff;
            outline: 4px solid #000000;
            box-shadow: 0 0 0 8px #555555, 0 10px 20px rgba(0,0,0,0.9);
        }
    </style>
</head>

    <!-- Web Audio API Minecraft Button Click Sound & Logic -->
    <script>
        let soundEnabled = true;
        let audioCtx = null;

        // Initialize Web Audio Context for synthesized Minecraft UI click sound
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Synthesize authentic Minecraft UI button click sound using Web Audio API
        function playMcClickSound() {
            if (!soundEnabled) return;
            
            try {
                const ctx = getAudioContext();
                if (!ctx) return;

                // Create noise buffer for woody click punch
                const bufferSize = ctx.sampleRate * 0.04; // 40ms noise burst
                const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                const whiteNoise = ctx.createBufferSource();
                whiteNoise.buffer = noiseBuffer;

                // Filter for wooden click timbre
                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 800; // Pitch center
                filter.Q.value = 3.0;

                // Envelope
                const gainNode = ctx.createGain();
                gainNode.gain.setValueAtTime(0.8, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.035);

                whiteNoise.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(ctx.destination);

                whiteNoise.start();
            } catch (e) {
                console.error("Audio play error:", e);
            }
        }

        // Toggle Sound ON/OFF
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const soundIcon = document.getElementById('soundIcon');
            const soundText = document.getElementById('soundText');

            if (soundEnabled) {
                soundIcon.className = "fa-solid fa-volume-high text-yellow-400";
                soundText.textContent = "SOUND: ON";
                playMcClickSound();
            } else {
                soundIcon.className = "fa-solid fa-volume-xmark text-red-400";
                soundText.textContent = "SOUND: OFF";
            }
        }

        // Link click handling with sound & deep link redirect
        function handleLinkClick(event, type, target) {
            playMcClickSound();

            if (type === 'telegram') {
                event.preventDefault();
                const webUrl = `https://t.me/${target}`;
                const deepLinkUrl = `tg://resolve?domain=${target}`;

                // Attempt to launch Telegram app directly
                window.location.href = deepLinkUrl;

                // Web fallback
                setTimeout(() => {
                    window.open(webUrl, '_blank');
                }, 400);
            } else if (type === 'discord') {
                // Let browser handle opening discord link after short delay for sound
                event.preventDefault();
                const discordUrl = `https://discord.gg/${target}`;
                setTimeout(() => {
                    window.open(discordUrl, '_blank');
                }, 150);
            }
        }

        // Copy Page URL Link
        function copyLink(event) {
            playMcClickSound();
            const pageUrl = window.location.href;
            
            const tempInput = document.createElement('input');
            tempInput.value = pageUrl;
            document.body.appendChild(tempInput);
            tempInput.select();
            
            try {
                document.execCommand('copy');
                showToast("LINK COPIED TO CLIPBOARD!");
            } catch (err) {
                showToast("FAILED TO COPY!");
            }
            
            document.body.removeChild(tempInput);
        }

        // Display Toast Notification
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastText').textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }
    </script>
</body>
